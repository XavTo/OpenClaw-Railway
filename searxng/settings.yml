use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - wikipedia
      - brave
      - startpage
general:
  instance_name: OpenClaw Private Search
  enable_metrics: false
search:
  formats:
    - html
    - json
server:
  bind_address: "::"
  port: 8080
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 5
  max_request_timeout: 9
